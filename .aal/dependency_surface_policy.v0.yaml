policy_version: dependency_surface_policy.v0
repo: scrimshawlife-ctrl/Abraxas
# ---------------------------------------------------------------------------------------------
# HOW A PATH'S ROLE IS RESOLVED, AND WHY AN UNCLASSIFIED PATH IS NOT AN OVERSIGHT
#
# The role comes from the LONGEST matching prefix in `path_role_map` below. `allow_fallback_heuristic`
# is false, so there is no guessing: a path is either classified explicitly or it is not.
#
# A path matching NO prefix at all resolves to role `None`, and `None` is FAIL-CLOSED: if that file
# imports a manifest-tracked optional/entrypoint dependency, the boundary check reports
# "... module surface role is unclassified and fallback is disabled". So an unclassified path is
# ENFORCED, not ignored.
#
# Measured 2026-10-07 across the 3612 TRACKED .py files: 267 match no prefix, including whole
# directories (core/, tools/, vendor/, abx_familiar/, abraxas_ase/, aal_core/, examples/), and 105 of
# abraxas/'s 112 subdirectories -- e.g. visuals/, viz/, menus/, render/, scoreboard/ -- inherit the
# `abraxas/` catch-all instead of a specific entry. That is deliberate and safe. DO NOT "fix" it by
# bulk-classifying those paths: a role is a CLAIM about what a surface may do, so every entry needs
# per-path evidence, and a blanket mapping only loosens what the check enforces.
#
# When a path genuinely needs to be named -- typically because it must legally import an entrypoint
# dependency -- scope the entry as narrowly as the evidence supports, prefer a FILE over a DIRECTORY,
# and pin the narrowness with a test that fails if someone widens it. Worked example: the file-scoped
# `abraxas/dashboard/api.py` entry below, guarded by
# tests/test_check_optional_dependency_boundaries.py::test_dashboard_exemption_is_file_scoped_not_directory_scoped
# ---------------------------------------------------------------------------------------------
allow_fallback_heuristic: false
roles:
  - truth_authoritative
  - launch_surface
  - optional_adapter_surface
  - test_only
  - legacy
path_role_map:
  - prefix: tests/
    role: test_only
  - prefix: abx/optional_dependencies.py
    role: optional_adapter_surface
  - prefix: abx/optional_jinja2.py
    role: optional_adapter_surface
  - prefix: abraxas/osh/
    role: optional_adapter_surface
  - prefix: abraxas/db/
    role: optional_adapter_surface
  - prefix: abraxas/core/
    role: truth_authoritative
  - prefix: abx/core/
    role: truth_authoritative
  - prefix: abx/runtime/
    role: truth_authoritative
  - prefix: shared/
    role: truth_authoritative
  - prefix: webpanel/
    role: launch_surface
  - prefix: server/
    role: launch_surface
  - prefix: abraxas/web/
    role: launch_surface
  - prefix: abraxas/lens/
    role: launch_surface
  - prefix: abraxas/api/
    role: launch_surface
  - prefix: abraxas/cli/
    role: launch_surface
  # SCOPED TO THE FILE, NOT THE DIRECTORY, deliberately.
  #
  # `abraxas/dashboard/api.py` is the dashboard entrypoint: `Dockerfile.dashboard-api` launches it with
  # `CMD ["python", "api.py"]` and it is read/serve only (8 GET routes, one telemetry POST, no
  # INSERT/UPDATE/DELETE, no file writes), so it must be able to import its web framework.
  #
  # Any OTHER module under abraxas/dashboard/ still inherits the `abraxas/` catch-all below and remains
  # truth_authoritative, so truth computation added there later cannot inherit this exemption.
  # Guard: tests/test_check_optional_dependency_boundaries.py::
  #        test_dashboard_exemption_is_file_scoped_not_directory_scoped
  - prefix: abraxas/dashboard/api.py
    role: launch_surface
  - prefix: abx/ui/
    role: launch_surface
  - prefix: abx/server/
    role: launch_surface
  - prefix: tools/aatf/aatf/
    role: launch_surface
  - prefix: scripts/
    role: launch_surface
  - prefix: abx/cli.py
    role: launch_surface
  - prefix: src/
    role: truth_authoritative
  - prefix: abx/
    role: truth_authoritative
  - prefix: abraxas/
    role: truth_authoritative
