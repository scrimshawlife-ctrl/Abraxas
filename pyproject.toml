[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abraxas"
version = "1.5.0"
description = "Abraxas - Deterministic Symbolic Intelligence with Predictive Forecasting"
readme = "README_ORIN.md"
requires-python = ">=3.8"
authors = [
    {name = "Abraxas Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Core dependencies
# Note: this list includes both truth-authoritative dependencies and launch-surface
# dependencies. The governance manifest (.aal/dependency_manifest.v0.yaml) is the
# canonical source for truth-authority boundaries.
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "jsonschema>=4.22.0",
    "rich>=13.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "numpy>=1.24.0",
    "cryptography>=42.0.0",
    "cbor2>=5.6.0",
    "msgpack>=1.0.8",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
# Server dependencies (FastAPI for full features)
server = [
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "argon2-cffi>=23.1.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "sentence-transformers>=2.2.0",
    "websockets>=12.0",
]

webpanel = [
    "jinja2>=3.1.0",
]

lens = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

# PostgreSQL support
postgres = [
    # asyncpg is what abraxas/adapters/postgresql_domain_adapter.py actually
    # imports (line 5). It was declared NOWHERE before this, so installing the
    # documented way gave you two drivers the code does not use and omitted the
    # one it does -- and any test touching the adapter died at import.
    "asyncpg>=0.29.0",
    "psycopg>=3.1.0",
    "psycopg2-binary>=2.9.0",
]

# External bridge adapters (non-authoritative optional integrations)
bridge = [
    "requests>=2.31.0",
]

# TimesFM 2.5 Shadow lab (CPU smoke only; never required for CI)
timesfm = [
    "torch>=2.2.0",
    "transformers>=4.57.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.22.0",
    "jinja2>=3.1.0",
    # starlette.testclient imports httpx. The webpanel tests use TestClient, so without
    # this a fresh `pip install -e ".[dev]"` cannot run them -- the harness depended on a
    # package nothing declared.
    # defusedxml: sitemap/RSS parsing in abraxas/acquisition takes input fetched from
    # third-party hosts. xml.etree is not hardened against entity-expansion attacks.
    "defusedxml>=0.7.1",
    # starlette ceiling, MEASURED: with jinja2 held constant at 3.1.6, starlette 0.37.2
    # passes all 67 webpanel tests and starlette 1.7.0 fails 7 with
    #   TypeError: cannot use 'tuple' as a dict key (unhashable type: 'dict')
    # surfacing at jinja2/utils.py:515 through the test client. Test harness only --
    # the [server] extra is left free.
    "starlette<1.0",
    "httpx>=0.27.0",
    # The linter is a DECLARED dev dependency, not a globally-hoped-for binary: CI installs
    # `.[dev]` and then runs `make lint`, so ruff has to arrive the same way the tests do.
    "ruff>=0.6",
]

# Full installation (server + dev)
full = [
    "abraxas[server,dev]",
]

[project.scripts]
# CLI entry points
abx = "abx.cli:main"
abraxas = "abraxas.cli.main:main"
abraxas-ase = "abraxas_ase.cli:main"
abraxas-oracle = "abraxas.oracle.cli:main"

[project.entry-points."abx.plugins"]
abraxas = "abraxas.plugin:register"

[tool.setuptools.packages.find]
# DISCOVERY, NOT A HAND LIST. This was an explicit `packages = [...]` naming 73 entries against 133 real
# subpackages in the tree, so 85 were absent from every install -- including abraxas.evidence,
# abraxas.engines, abraxas.phase and abraxas.yggdrasil. Every engine repository declares this project as a
# git dependency, so a clean install could not import any of them. Measured by installing in a fresh venv
# and watching `import abraxas.evidence` raise ModuleNotFoundError.
#
# `tests/test_packaging_covers_the_tree.py` asserts the configured set covers every `abraxas.*` subpackage
# with an __init__.py, whatever form the configuration takes -- so this can be a list again if anyone
# prefers, but it cannot silently disagree with the tree.
include = ["abraxas*", "abx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    # Deprecations are ERRORS here -- the policy the CI step always intended, now expressed
    # in config instead of a CLI flag. Measured: the CLI -W form is applied AFTER these and
    # overrides them, which is why an identical ignore in this file had no effect while the
    # step passed -W error::DeprecationWarning (exit 2 with the CLI flag, 0 without).
    "error::DeprecationWarning",
    # NAMED third-party ignore. anyio raises this from library code when the test client
    # spins a portal; ZERO call sites exist in this repo, so no code change can fix it.
    # Matched on the exact message, not the category, so a NEW deprecation still fails.
    # Later entries take precedence, so this must follow the error above.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # A test that returns a value instead of asserting can never fail: pytest ignores
    # the return and marks it passed. Escalating this warning makes the return-as-signal
    # idiom fail loudly rather than silently going green. Verified: the 6 collected
    # offenders across tests/ webpanel/ abraxas/ were removed, and re-injecting one
    # (in tests/) errors the run.
    "error::pytest.PytestReturnNotNoneWarning",
]

[tool.ruff]
# A DELIBERATE standard, not "whatever ruff happens to default to". Two scope choices are
# load-bearing and are recorded here so nobody has to re-derive them:
#
#   UP is NOT selected. The `typing.List` -> `list` annotation migration is 6,484 findings on
#   its own; switching it on would bury every real finding under a migration that deserves its
#   own scheduled change.
#   E5 (line length) is NOT selected either -- `line-length` below governs the formatter only.
#
# Excluded paths are the tree's generated/rewritten surfaces (out/, data/, .abraxas/, .aal/) and
# the JS frontend, none of which are Python we own.
line-length = 100
target-version = "py312"
extend-exclude = [
    "out",
    "data",
    ".abraxas",
    ".aal",
    "frontend",
    "examples",
]

[tool.ruff.lint]
select = [
    "F",   # pyflakes: real defects -- unused imports/vars, redefinitions, undefined names
    "E4",  # import conventions
    "E7",  # statement-level issues
    "E9",  # runtime errors
    "W",   # whitespace
    "I",   # import sorting
    "B",   # flake8-bugbear: likely-bug patterns
    "C4",  # comprehension simplifications
    "SIM", # simplifications
    "RUF", # ruff's own correctness rules
]

# NOTHING IS IGNORED HERE ON PURPOSE. This ruleset has pre-existing debt, so the gate is a
# RATCHET (scripts/lint_ratchet.sh): the recorded per-rule counts may only ever DECREASE.
# An `ignore` would switch a rule OFF, and then a new violation of it could never fail --
# the ratchet keeps every rule ACTIVE and fails on any increase. Strictly stronger than an
# ignore list, and it mirrors the idiom already used by scripts/test_ratchet.sh.

[tool.coverage.run]
source = ["abraxas", "abx", "abx_familiar"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
