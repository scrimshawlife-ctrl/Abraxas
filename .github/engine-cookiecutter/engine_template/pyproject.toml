[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engine_template"
version = "0.1.0"
description = "Abraxas Engine Template"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Applied Alchemy Labs", email = "appliedalchemylabs@example.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "abraxas-evidence @ git+https://github.com/scrimshawlife-ctrl/Abraxas.git#subdirectory=abraxas",
    "pydantic>=2.0",
    "numpy>=1.24",
]

# A multi-line inline table is invalid TOML: inline tables must occupy a single line. This was
# written as `optional-dependencies = { ... }` spanning lines 25-44, which made the whole file
# unparseable, and because ruff walks the tree and stops on the first file it cannot parse, that one
# defect silently disabled linting for this entire repository.
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
gpu = [
    "torch>=2.0",
    "torchaudio>=2.0",
]
hf = [
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
]
neon = [
    "neon-sdk>=0.1",
]

[project.urls]
Homepage = "https://github.com/scrimshawlife-ctrl/engine_template"
Repository = "https://github.com/scrimshawlife-ctrl/engine_template"
Issues = "https://github.com/scrimshawlife-ctrl/engine_template/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["engine_template*"]

[tool.setuptools.package-dir]
"engine_template" = "src/engine_template"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "TRY003"]
# TOML inline tables use `=`, not `:`. The colon form was invalid TOML and contributed to the same
# repository-wide lint failure as the optional-dependencies table above.
per-file-ignores = {"tests/*" = ["S101", "TRY003"]}

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/engine_template"]
omit = ["tests/*", "src/engine_template/compat/*"]

[tool.abraxas]
compute_profile = "cpu"
gpu_memory_gb = 0
engine_name = "engine_template"
evidence_type = "EVIDENCE_TYPE"

[tool.hatch.build.targets.wheel]
packages = ["src/engine_template"]

[tool.hatch.envs.default]
dependencies = []
