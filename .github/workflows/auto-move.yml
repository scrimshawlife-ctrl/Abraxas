name: Auto-move Cards on Merge

# Rewritten 2026-10-08 against GitHub PROJECTS V2.
#
# The original drove GitHub Projects (classic) through
# alex-page/github-project-automation-plus@v0.8.0, targeting a project named "Kanban" with
# To Do / In Progress / Done columns. Projects classic is retired -- the REST endpoint now
# returns 404 -- and no such project existed, so this workflow had never run successfully.
# The board it targets now exists for real: GitHub Projects v2 "Kanban", number 7,
# owner scrimshawlife-ctrl.
#
# AUTH -- why this uses a secret and not GITHUB_TOKEN:
#   GITHUB_TOKEN is scoped to the repository, and GitHub Projects sits OUTSIDE that scope,
#   so it cannot read or write any Projects v2 API. GitHub's own documentation directs you
#   to a token carrying explicit Projects permissions. This repository's owner is a USER,
#   not an organization, and for user-owned projects the only supported credential is a
#   CLASSIC personal access token with the `project` scope (fine-grained tokens do not
#   support user-owned projects). Store it as the repository secret PROJECT_TOKEN.
#   Without it, the job fails with the explicit message below rather than a cryptic
#   "Could not resolve to a ProjectV2" error.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  auto-move:
    name: Auto-move PR to Done
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Add the merged PR to Kanban and set Status = Done
        env:
          # A classic PAT with the `project` scope. NOT github.token -- see the AUTH note.
          # PROJECT_TOKEN is preferred; ABRAXAS_PAT (already present) is the fallback, so
          # this works today if that PAT carries `project` scope, and without a new secret.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.ABRAXAS_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Neither PROJECT_TOKEN nor ABRAXAS_PAT is set, so this job cannot reach Projects v2."
            echo "The default GITHUB_TOKEN is repository-scoped and cannot access Projects."
            echo "Add a CLASSIC personal access token with the 'project' scope as the repository"
            echo "secret PROJECT_TOKEN (fine-grained tokens do not support user-owned projects),"
            echo "or give the existing ABRAXAS_PAT that scope."
            exit 1
          fi

          PR_URL="${{ github.event.pull_request.html_url }}"
          echo "merged PR: $PR_URL"

          # A token being PRESENT is not the same as a token being USABLE. Measured
          # 2026-10-08: GH_TOKEN was non-empty (the ABRAXAS_PAT fallback exists) but
          # `gh project item-add` failed with gh's symptom "unknown owner type" because the
          # token cannot resolve the owner -- i.e. it lacks the `project` scope. Without this
          # the failure is a cryptic one-liner.
          _scope_hint() {
            echo "GITHUB_TOKEN cannot be used here: it is repository-scoped and cannot reach the"
            echo "Projects v2 API at all. A USER-owned project (this owner is a user, not an org)"
            echo "accepts ONLY a CLASSIC personal access token carrying the 'project' scope;"
            echo "fine-grained tokens do not support user-owned projects."
            echo "Set the repository secret PROJECT_TOKEN to such a PAT. The ABRAXAS_PAT fallback"
            echo "exists but is insufficient as measured on 2026-10-08."
          }

          # Idempotent: when the PR is already on the board this returns the existing item
          # rather than creating a duplicate (measured: item-add run twice on one PR returned
          # the same item id and the board count stayed at 1).
          if ! ITEM_ID="$(gh project item-add 7 --owner scrimshawlife-ctrl --url "$PR_URL" --format json --jq '.id' 2>&1)"; then
            echo "::error::gh project item-add failed: $ITEM_ID"
            _scope_hint
            exit 1
          fi
          echo "project item: $ITEM_ID"

          # Status is a single-select field on project 7; 98236657 is its "Done" option.
          if ! gh project item-edit \
            --id "$ITEM_ID" \
            --project-id PVT_kwHODd8rms4BmKxM \
            --field-id PVTSSF_lAHODd8rms4BmKxMzhk01Z4 \
            --single-select-option-id 98236657 2>&1; then
            echo "::error::gh project item-edit failed (the item was added but Status was not set)"
            _scope_hint
            exit 1
          fi

          echo "moved merged PR to Done."
