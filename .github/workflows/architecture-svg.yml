name: architecture-svg

on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/assets/architecture/**
      - scripts/export_architecture_svg.sh
      - scripts/validate_architecture_svg.sh
      - scripts/check_architecture_svg_sync.sh
      - README.md
      - docs/architecture/overview.md
  push:
    paths:
      - docs/assets/architecture/**
      - scripts/export_architecture_svg.sh
      - scripts/validate_architecture_svg.sh
      - scripts/check_architecture_svg_sync.sh
      - README.md
      - docs/architecture/overview.md

jobs:
  svg-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate tracked architecture SVG
        run: make svg-validate

  svg-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert the SVG was regenerated from the current Mermaid source
        run: scripts/check_architecture_svg_sync.sh
