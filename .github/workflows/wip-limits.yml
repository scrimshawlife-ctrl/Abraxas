name: WIP Limits Enforcement

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issues:
    types: [opened, reopened]

jobs:
  wip-check:
    name: Check WIP Limits
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Check open PRs per author
        uses: actions/github-script@v9
        with:
          script: |
            // NOTE: no `head:` filter here, deliberately. The API expects "owner:branch";
            // a bare branch name is SILENTLY IGNORED (measured 2026-10-08: head=definitely-
            // not-real-xyz returned every open PR, while head=scrimshawlife-ctrl:... returned
            // 0). It was passed the bare ref, so it filtered nothing -- the author check
            // below is what actually scopes this. Kept removed rather than left as a no-op
            // that reads as a filter.
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            // WIP limit: max 3 open PRs per author
            const author = context.payload.pull_request?.user?.login || context.payload.issue?.user?.login;
            const authorPRs = prs.filter(pr => pr.user.login === author);
            
            if (authorPRs.length > 3) {
              core.setFailed(`WIP limit exceeded: @${author} has ${authorPRs.length} open PRs (max 3)`);
            } else {
              console.log(`✓ @${author} has ${authorPRs.length}/3 open PRs`);
            }
  
      - name: Check total open PRs
        uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            // WIP limit: max 10 total open PRs
            if (prs.length > 10) {
              core.setFailed(`WIP limit exceeded: ${prs.length} total open PRs (max 10)`);
            } else {
              console.log(`✓ Total open PRs: ${prs.length}/10`);
            }
  
      - name: Check open issues (if issue event)
        if: github.event_name == 'issues'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            // GitHub's issues endpoint returns issues AND PULL REQUESTS; every PR carries a
            // `pull_request` key. Counting the raw list inflates the number and would trip
            // this limit early once PRs exist. Count only real issues.
            const realIssues = issues.filter(i => !i.pull_request);
            
            // WIP limit: max 20 open issues
            if (realIssues.length > 20) {
              core.setFailed(`WIP limit exceeded: ${realIssues.length} open issues (max 20, excluding PRs)`);
            } else {
              console.log(`✓ Total open issues: ${realIssues.length}/20`);
            }