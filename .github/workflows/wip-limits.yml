name: WIP Limits Enforcement

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issues:
    types: [opened, reopened]

jobs:
  wip-check:
    name: Check WIP Limits
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Check open PRs per author
        uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: context.payload.pull_request?.head?.ref || '',
              per_page: 100
            });
            
            // WIP limit: max 3 open PRs per author
            const author = context.payload.pull_request?.user?.login || context.payload.issue?.user?.login;
            const authorPRs = prs.filter(pr => pr.user.login === author);
            
            if (authorPRs.length > 3) {
              core.setFailed(`WIP limit exceeded: @${author} has ${authorPRs.length} open PRs (max 3)`);
            } else {
              console.log(`✓ @${author} has ${authorPRs.length}/3 open PRs`);
            }
  
      - name: Check total open PRs
        uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            // WIP limit: max 10 total open PRs
            if (prs.length > 10) {
              core.setFailed(`WIP limit exceeded: ${prs.length} total open PRs (max 10)`);
            } else {
              console.log(`✓ Total open PRs: ${prs.length}/10`);
            }
  
      - name: Check open issues (if issue event)
        if: github.event_name == 'issues'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            // WIP limit: max 20 open issues
            if (issues.length > 20) {
              core.setFailed(`WIP limit exceeded: ${issues.length} open issues (max 20)`);
            } else {
              console.log(`✓ Total open issues: ${issues.length}/20`);
            }