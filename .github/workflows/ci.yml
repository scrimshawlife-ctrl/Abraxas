name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Every step runs under `set -eo pipefail`. Without pipefail a step like
    # `pytest ... | tail -5` reports TAIL's exit code, which is always 0, so the step
    # cannot fail no matter what pytest says. This workflow had exactly that bug and
    # three steps were affected. The flag is set once, here, so a future pipe is covered
    # by default rather than by remembering.
    defaults:
      run:
        shell: bash -eo pipefail {0}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Install Abraxas in development mode.
          # `postgres` added 2026-10-08: tests/test_postgresql_domain_adapter.py
          # importorskip("asyncpg"), so with the extra absent the whole module skipped
          # and its 7 tests never ran in CI. The extra now declares asyncpg (the driver
          # the adapter actually imports), and the module's async test is driven with
          # asyncio.run rather than a bare `async def test_`, so the module collects and
          # passes with the driver present. Install it here so the module is guarded.
          pip install -e ".[dev,server,postgres]"

      - name: Setup Node for graft
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install graft CLI
        run: |
          npm install -g @nanonets/graft
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Build graft context graph
        run: |
          export PATH="$(npm bin -g):$PATH"
          graft build --dir graft || true

      # Graft is the source of truth for open-gap queries (promotion, BETA scorecard, CI guards).
      # Every gap query goes through graft first; direct greps are only for unindexed files.
      - name: Run graft-powered gap analysis
        run: |
          export PATH="$(npm bin -g):$PATH"
          which graft || (echo "graft not in PATH"; exit 1)
          PYTHONPATH=. python3 scripts/graft_gap_analyzer.py --mode binding,residual
          PYTHONPATH=. python3 scripts/scan_todo_markers.py --repo-root . --out out/reports/todo_markers.ci.json
          PYTHONPATH=. python3 scripts/graft_combined_gap_report.py

      # Scope widened 2026-10-08: this job ran tests/evidence, tests/integration,
      # tests/chaos and webpanel, but never tests/ -- which holds 680 files. All seven
      # failures fixed in the 2026-10-08 remediation lived in tests/*.py and were
      # invisible to CI by construction. The suite is green now, so CI can enforce it;
      # a green suite with no guardian rots back. Keep the named files below.
      # Coverage is measured here because it was measured NOWHERE before. [tool.coverage.run] and
      # [tool.coverage.report] were fully specified and this job even installed pytest-cov, but no
      # workflow ever passed --cov -- so `fail_under` was dormant configuration and the real figure
      # (63% on 2026-10-08) was unknown. It rides the existing run rather than adding a fourth
      # pytest pass, so the only added cost is instrumentation.
      #
      # The floor lives in pyproject.toml, not here, so there is one number. Verified enforced by
      # pytest-cov, not assumed: a 3-test subset reports 1.09% and exits 1 against the 60 floor.
      - name: Run core tests
        run: |
          python -m pytest tests/ webpanel abraxas/evidence \
            abraxas/evidence/test_hyperlex_q1.py tests/test_hyperlex_instrument_evidence.py \
            abraxas/evidence/test_semion_q1.py abraxas/evidence/test_noesis_q1.py \
            abraxas/evidence/test_trutina_q1.py abraxas/evidence/test_abraxas_q1.py \
            tests/test_resonance_narratives_* tests/test_oracle_v2* \
            tests/test_synchronicity* tests/test_vbm_phase_classifier.py \
            tests/test_ritual_system.py \
            -q --tb=short \
            --cov=abraxas --cov=abx --cov=abx_familiar --cov-report=term-missing:skip-covered
      
      # This step was named "Verify test count" and verified no count at all. It piped
      # `--collect-only -q` into `grep "test session starts"`, and pytest prints that
      # session header even when collection FAILS -- while the pipeline returned grep's
      # status, not pytest's. Measured: a test file with an unimportable module left
      # this step at exit 0. It now fails on a collection error and asserts a real
      # floor.
      #
      # FLOOR is measured, not invented: CI collected 3890 items on 2026-10-08 (3881
      # passed + 9 xfailed). It sits about 1% low so ordinary churn does not trip it;
      # its job is to catch tests disappearing silently. Raise it deliberately when
      # the suite grows -- a floor nobody updates stops being a guardian.
      - name: Verify test count
        run: |
          set -euo pipefail
          if ! out=$(python -m pytest tests/ webpanel abraxas/evidence \
            abraxas/evidence/test_hyperlex_q1.py tests/test_hyperlex_instrument_evidence.py \
            abraxas/evidence/test_semion_q1.py abraxas/evidence/test_noesis_q1.py \
            abraxas/evidence/test_trutina_q1.py abraxas/evidence/test_abraxas_q1.py \
            tests/test_resonance_narratives_* tests/test_oracle_v2* \
            tests/test_synchronicity* tests/test_vbm_phase_classifier.py \
            tests/test_ritual_system.py --collect-only -q 2>&1); then
            printf '%s\n' "$out" | tail -40
            echo "::error::test collection failed"
            exit 1
          fi
          count=$(printf '%s\n' "$out" | sed -n 's/.*collected \([0-9][0-9]*\) items.*/\1/p' | head -1)
          if [ -z "$count" ]; then
            printf '%s\n' "$out" | tail -40
            echo "::error::could not parse a collected count from pytest output"
            exit 1
          fi
          echo "collected=$count floor=$FLOOR"
          if [ "$count" -lt "$FLOOR" ]; then
            echo "::error::collected $count tests, below the floor of $FLOOR -- tests have gone missing"
            exit 1
          fi
        env:
          FLOOR: 3850
      
      # This step ran `-q` and nothing else for its whole life: it re-ran the suite and
      # checked for NO deprecation. It passed while the repo had 28 pydantic class-based
      # config deprecations and 8 class-scoped fixtures pending removal. Now it actually
      # checks, and fails if one of OUR deprecations appears.
      #
      # The ignore is deliberate and narrow. `anyio` deprecates the `anyio.abc.BlockingPortal`
      # alias, but the warning is raised at the stacklevel of starlette/testclient.py:45, so
      # Python attributes it to `starlette.testclient` -- not to anyio, which is why an
      # `:anyio` filter matches nothing. We do not own that frame and cannot fix it here.
      # Verified: `-W error` alone gives 8 collection errors, this filter gives 0, and a
      # deliberately-injected DeprecationWarning in our own test still fails the step.
      - name: Check for deprecation warnings
        run: |
          python -m pytest tests/ webpanel abraxas/evidence \
            abraxas/evidence/test_hyperlex_q1.py tests/test_hyperlex_instrument_evidence.py \
            abraxas/evidence/test_semion_q1.py abraxas/evidence/test_noesis_q1.py \
            abraxas/evidence/test_trutina_q1.py abraxas/evidence/test_abraxas_q1.py \
            tests/test_resonance_narratives_* tests/test_oracle_v2* \
            tests/test_synchronicity* tests/test_vbm_phase_classifier.py \
            tests/test_ritual_system.py -q \
            -W error::DeprecationWarning \
            -W ignore::DeprecationWarning:starlette.testclient

      # Lint is a RATCHET, not a bare `ruff check`. The configured ruleset ([tool.ruff.lint] in
      # pyproject.toml) carries pre-existing debt, so a gate that is red on day one and stays red
      # would just be ignored -- and an `ignore` list would switch rules OFF so a new violation
      # could never fail. `make lint` keeps every rule active and fails only if a recorded
      # per-rule count grows. Baseline: scripts/lint_baseline.json.
      - name: Lint (ratchet)
        run: make lint

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      
      - name: Run health checks
        run: |
          python scripts/health_check.py --check-all

  validate-configs:
    name: Validate Configs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Validate YAML configs
        run: |
          python -c "
          import yaml, sys
          for f in ['deployment/helm-chart/abraxas/values-prod.yaml', 'deployment/helm-chart/abraxas/templates/configmap-prod.yaml']:
              yaml.safe_load(open(f))
              print(f'✓ {f} valid')
          "
      
      - name: Validate JSON configs
        run: |
          python -c "
          import json, sys
          for f in ['deployment/grafana/abraxas-overview.json']:
              json.load(open(f))
              print(f'✓ {f} valid')
          "
      
      - name: Validate deploy script syntax
        run: |
          bash -n scripts/deploy_production.sh && echo "✓ deploy_production.sh syntax OK"

  pipeline-dry-run:
    name: Pipeline Dry Run
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      
      - name: Run pipeline dry-run (3 cycles)
        run: |
          mkdir -p /tmp/test_output
          # `|| true` is deliberate: --mock can exit non-zero on the final cycle and the
          # real assertion is the "Verify output" step below, which reads the files back.
          # It is kept, but named here so it is not mistaken for an accidental swallow.
          timeout 20 python scripts/run_production_pipeline.py \
            --mock --domains politics media finance \
            --output /tmp/test_output --interval 5 || true
      
      - name: Verify output
        run: |
          ls -la /tmp/test_output/
          python -c "
          import json
          for f in ['/tmp/test_output/cycle_000001.json', '/tmp/test_output/cycle_000002.json', '/tmp/test_output/cycle_000003.json']:
              data = json.load(open(f))
              assert 'cycle' in data and 'oracle_bundle' in data and 'narrative' in data
              print(f'✓ {f} valid structure')
          print('✓ All pipeline outputs valid')
          "