# Default values for abraxas.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: abraxas-framework
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "4.0.2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # hosts:
  #   - host: chart-example.local
  #     paths:
  #       - path: /
  #         pathType: Prefix
  # tls:
  #   - secretName: chart-example-tls
  #     hosts:
  #       - chart-example.local

resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Volume definition.
volumes: []
# - name: abraxas-storage
#   persistentVolumeClaim:
#     claimName: abraxas-pvc

# Additional volumeMounts on the output Container definition.
volumeMounts: []
# - name: abraxas-storage
#   mountPath: /abraxas/data
#   readOnly: false

nodeSelector: {}

tolerations: []

affinity: {}

# Abraxas specific configuration
abraxas:
  # Memory layer configuration
  memory:
    storagePath: /abraxas/data/memory
    # Enable Timechain integration (requires additional setup)
    timechainEnabled: false
    timechainConfig: {}
      # root: /path/to/timechain/root
      # network: mainnet
      # contractAddress: 0x...
      # privateKey: ...  # Should be stored in a secret

  # Orchestrator configuration
  orchestrator:
    # Engine initialization timeout (seconds)
    engineInitTimeout: 30
    # Arbitration timeout (seconds)
    arbitrationTimeout: 10
    # Governance check strictness (0.0-1.0)
    governanceStrictness: 0.8
    # Streaming processor configuration
    streaming:
      enabled: true
      numWorkers: 4
      queueMaxSize: 1000
      resultTimeout: 30.0

  # Logging configuration
  logging:
    level: INFO
    # Format: json or text
    format: json
    # File path for logs (if empty, logs to stdout only)
    filePath: ""
    # Max size in MB before rotation
    maxSizeMB: 10
    # Number of backup files to keep
    backupCount: 5

  # Resource limits for the Abraxas container (overrides top-level resources if set)
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

# Blue-Green deployment strategy
bluegreen:
  # Enable blue-green deployment strategy (disables regular deployment when true)
  enabled: false
  # Which version is active: "blue" or "green"
  activeColor: "blue"