# Negative fixtures (must raise ValueError or appropriate error)
fixture_invalid_probability_out_of_range:
  description: "probability > 1 must be rejected"
  input_modification:
    forecasts:
      - forecast_id: "f1"
        probability: 1.5
        signal_key: "test"
        mapping_version: "v1"
      - forecast_id: "f2"
        probability: -0.1
        signal_key: "test"
        mapping_version: "v1"
    outcomes:
      - forecast_id: "f1"
        outcome_value: 1
        settlement_id: "s1"
      - forecast_id: "f2"
        outcome_value: 0
        settlement_id: "s2"
  expected_error: "ValueError"
  expected_message: "probability out of [0,1]"

