fixture_single_capture:
  description: "Single capture edge case -> manifold integrity = 1.0"
  input:
    schema: "noesis.latent.v1"
    version: "NOESIS_LATENT_V1"
    request_id: "test-008"
    latent_captures:
      - condition: "baseline"
        activations: [[1.0, 2.0, 3.0]]
        metadata: {layer: "layer_1", timestep: 0}
    baseline_condition: "baseline"
    analysis_config: {}
  expected_analysis:
    manifold_integrity: 1.0
    conditions_tested: []

# Negative fixtures (authority boundary)
fixture_semantic_truth_true:
  description: "semantic_truth=true must be rejected"
  envelope_modification:
    provenance:
      semantic_truth: true
  expected_error: "assert_not_authoritative"

fixture_non_advisory_authority:
  description: "authority.kind != advisory must be rejected"
  envelope_modification:
    provenance:
      authority: "authoritative"
  expected_error: "assert_not_authoritative"

fixture_valid_for_forecast_true:
  description: "valid_for_forecast=true must be rejected"
  envelope_modification:
    provenance:
      valid_for_forecast: true
  expected_error: "assert_not_authoritative"

fixture_influence_policy_not_none:
