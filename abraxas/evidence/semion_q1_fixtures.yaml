# Negative fixtures (must raise SemionAuthorityError)
fixture_invalid_format:
  description: "Invalid sign class format must be rejected"
  input_modification:
    sign_class: "invalid-format"
    sign_class_valid: false
    sign_class_errors: ["Invalid sign class format (need existence-thirdness-relation): invalid-format"]
  expected_error: "SemionAuthorityError"

fixture_invalid_existence:
  description: "Invalid existence category must be rejected"
  input_modification:
    sign_class: "invalid-rheme-icon"
    sign_class_valid: false
    sign_class_errors: 
      - "Invalid existence category: invalid (must be: qualisign, sinsign, legisign)"
      - "Invalid Peircean combination: invalid-rheme-icon"
  expected_error: "SemionAuthorityError"

fixture_invalid_thirdness:
  description: "Invalid thirdness category must be rejected"
  input_modification:
    sign_class: "qualisign-invalid-icon"
    sign_class_valid: false
    sign_class_errors:
      - "Invalid thirdness category: invalid (must be: rheme, dicent, argument)"
      - "Invalid Peircean combination: qualisign-invalid-icon"
  expected_error: "SemionAuthorityError"

fixture_invalid_relation:
  description: "Invalid relation category must be rejected"
  input_modification:
    sign_class: "qualisign-rheme-invalid"
    sign_class_valid: false
    sign_class_errors:
      - "Invalid relation category: invalid (must be: icon, index, symbol)"
      - "Invalid Peircean combination: qualisign-rheme-invalid"
  expected_error: "SemionAuthorityError"

fixture_semantic_truth_true:
  description: "semantic_truth=true must be rejected"
  input_modification:
    authority:
